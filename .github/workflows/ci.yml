name: MARSLib FRC CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile
      run: ./gradlew compileJava compileTestJava -Pskip-inspector-wrapper -Dorg.gradle.java.home=$JAVA_HOME

    - name: Build and Test with Coverage
      run: ./gradlew build jacocoTestReport -Pskip-inspector-wrapper -Dorg.gradle.java.home=$JAVA_HOME

    - name: Upload Test Reports (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MARSLib-Test-Reports
        path: build/reports/tests/test/

    - name: Upload Compiled JAR
      uses: actions/upload-artifact@v4
      with:
        name: MARSLib-Build
        path: build/libs/*.jar

    - name: Post PR Coverage Annotations
      uses: madrapps/jacoco-report@v1.7.2
      if: github.event_name == 'pull_request'
      with:
        paths: build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 80
        min-coverage-changed-files: 80
        title: "Test Coverage Report"

    - name: Generate Documentation Site
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: ./gradlew generateDocs -Pskip-inspector-wrapper -Dorg.gradle.java.home=$JAVA_HOME

    - name: Setup Node.js
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Docusaurus Website
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        cd website
        npm ci
        npm run build

    - name: Deploy docs to master branch
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: |
        cp -a website/build/. docs/
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/ -f
        git diff --cached --quiet && echo "No docs changes" || (git commit -m "docs: auto-update generated site [skip ci]" && git push)
