name: MARSLib FRC CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Apply Code Formatting
      run: ./gradlew spotlessApply

    - name: Commit Auto-formatted Code
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-format code with spotless [skip ci]"

    - name: Compile
      run: ./gradlew compileJava compileTestJava

    - name: Build and Test with Coverage
      run: ./gradlew build jacocoTestReport

    - name: Upload Test Reports (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MARSLib-Test-Reports
        path: build/reports/tests/test/

    - name: Upload Compiled JAR
      uses: actions/upload-artifact@v4
      with:
        name: MARSLib-Build
        path: build/libs/*.jar

    - name: Post PR Coverage Annotations
      uses: madrapps/jacoco-report@v1.7.2
      if: github.event_name == 'pull_request'
      with:
        paths: build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 80
        min-coverage-changed-files: 80
        title: "Test Coverage Report"

    - name: Generate JaCoCo Badges
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
        generate-branches-badge: true
        badges-directory: .github/badges

    - name: Commit JaCoCo Badges
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: update jacoco coverage badges [skip ci]"
        file_pattern: ".github/badges/*.svg"

    - name: Generate Documentation Site
      run: ./gradlew generateDocs

    - name: Upload Documentation Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MARSLib-Docs
        path: docs/

  # Deploy docs to GitHub Pages (only on push to master)
  deploy-docs:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download Documentation Artifact
      uses: actions/download-artifact@v4
      with:
        name: MARSLib-Docs
        path: docs/

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
